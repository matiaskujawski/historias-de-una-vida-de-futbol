services:
  - type: web
    name: historias-de-una-vida-de-futbol
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: PORT
        value: 3000
